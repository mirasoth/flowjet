# Example config for the local Mac Studio inference stack.
# Place and modify this file at ~/.flowjet/config/nano.yml (the default
# config path; see FLOWJET_HOME in docs/server.md).
#
# Or use the config argument to set a session-level config:
# Usage: fj -c ./config/nano-local.yml who are you

providers:
  - name: omlx
    provider_type: openai
    api_base_url: "http://localhost:9642/v1"
    api_key: ""
    models:
      - DeepSeek-V4-Flash-2bit-DQ
      - DeepSeek-OCR-4bit

router_profiles:
  - name: default
    router:
      default: "omlx:DeepSeek-V4-Flash-2bit-DQ"
      fast: "omlx:DeepSeek-V4-Flash-2bit-DQ"
      think: "omlx:DeepSeek-V4-Flash-2bit-DQ"
      ocr: "omlx:DeepSeek-OCR-4bit"
      image: "omlx:DeepSeek-OCR-4bit"

active_router_profile: default

persistence:
  default_backend: sqlite

security:
  allow_paths_outside_workspace: true
