# Platonic Coding Configuration (OPTIONAL)
# See more about project https://github.com/caesar0301/platonic-coding
#
# This file is OPTIONAL. Platonic Coding auto-detects project metadata
# (name, language, framework) from host manifests (Cargo.toml, package.json,
# pyproject.toml, go.mod, etc.) and uses built-in default paths:
#   specs:   .platonic/specs
#   impl:    .platonic/impl
#   drafts:  .platonic/drafts
#
# Create this file ONLY to override defaults, declare custom spec stages,
# or declare namespaces (see below). Generated by platonic-init.

# Override default artifact directories (uncomment and edit to use):
# paths:
#   specs: ".platonic/specs"             # Where RFC specifications live
#   impl: ".platonic/impl"              # Where implementation guides live
#   drafts: ".platonic/drafts"           # Where Phase 1 design drafts live

# Override spec conventions (uncomment and edit to use):
# specs:
#   numbering: "RFC-NNN-<name>"    # NNN = exactly 3 numeric chars (001-999), strict sequence unless user overrides; name = kebab-case semantic desc
#   stages: []                     # Custom stages, e.g. ["Core", "Storage", "API", "Infra"]

# Namespaces partition specs/impl artifacts by service or module for
# multi-service/monorepo projects. Declare them when the flat .platonic/specs and
# .platonic/impl directories grow too large to navigate. When no namespaces are
# declared, the project runs in single-namespace mode (fully backward
# compatible: all RFCs are RFC-NNN, all IGs are IG-NNN).
#
# Rules:
#   - prefix: 1-4 uppercase ASCII letters, unique across namespaces,
#     must NOT be "RFC" or "IG" (reserved). The skill proposes candidates
#     and the user confirms via ask_user — prefixes are never auto-assigned
#     silently.
#   - Namespaced RFC/IG IDs: RFC-<PREFIX>-NNN / IG-<PREFIX>-NNN, with an
#     INDEPENDENT strict sequence 001-999 per namespace.
#   - Root-level (cross-cutting) RFCs keep the RFC-NNN format and live in
#     the specs root.
#   - Directory convention: .platonic/specs/<name>/ and .platonic/impl/<name>/
#     (override per namespace below if needed).
# namespaces:
#   auth:
#     prefix: AUTH                 # 1-4 uppercase letters, user-confirmed
#     description: Authentication and identity
#     # specs: .platonic/specs/auth      # Optional, defaults to .platonic/specs/<name>
#     # impl: .platonic/impl/auth       # Optional, defaults to .platonic/impl/<name>
#   agentspace:
#     prefix: AGSP
#     description: Agent workspace service
#   realdeep:
#     prefix: RD
#     description: RealDeep research backend
